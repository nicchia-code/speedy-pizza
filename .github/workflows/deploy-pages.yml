name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fetch site branches
        run: git fetch origin main dev

      - name: Prepare worktrees
        run: |
          git worktree add --detach ../site-main origin/main
          git worktree add --detach ../site-dev origin/dev

      - name: Build production web app
        working-directory: ../site-main
        run: |
          flutter pub get
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Build development web app
        working-directory: ../site-dev
        run: |
          flutter pub get
          flutter build web --release --base-href "/${{ github.event.repository.name }}/dev/"

      - name: Compose Pages site
        run: |
          rm -rf site
          mkdir -p site/dev
          cp -R ../site-main/build/web/. site/
          cp -R ../site-dev/build/web/. site/dev/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
